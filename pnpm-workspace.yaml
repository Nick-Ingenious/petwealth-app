packages:
  - "apps/*"
  - "packages/*"

# Packages allowed to run install scripts (pnpm blocks them by default for supply-chain safety).
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@clerk/backend@3.31.4'
  - '@clerk/nextjs@7.10.7'
  - '@clerk/react@6.19.4'
  - '@clerk/shared@4.48.3'
